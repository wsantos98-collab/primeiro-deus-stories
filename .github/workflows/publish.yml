name: Publicar story Primeiro Deus

on:
  # Sem agendamento no GitHub (desde 27/09/2026): o scheduler passou a atrasar 5-6h.
  # Quem dispara é a sede, às 05:35 BRT, via launchd com.bedeal.garantir-story-primeiro-deus.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = só valida a ingestão, não publica"
        required: false
        default: "false"

permissions:
  contents: write

concurrency: publicar-story

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      # ref: main é obrigatório. Sem isso o checkout materializa o SHA do
      # EVENTO, e um despertar disparado antes das 05:30 BRT lê um
      # fila/published.json congelado, cego pro registro que outro run acabou
      # de fazer. Foi assim que o story de 2026-08-07 saiu duas vezes.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publicar story do dia
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WAIT_FOR_TARGET: ${{ github.event_name == 'schedule' }}
        run: python3 publish_story.py

      - name: Registrar publicação
        run: |
          git config user.name "primeiro-deus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 registrar.py
