name: Publicar story Primeiro Deus

on:
  schedule:
    # O scheduler do GitHub é best-effort e vinha entregando estes eventos com
    # 25-35min de atraso até 25/08. De 26/08 em diante o atraso pulou pra 5-12h
    # e em 27/08 e 02/09 nenhum evento chegou na janela da manhã — a série só
    # não furou porque o Jappa disparou na mão. A defesa é dupla:
    #
    # 1. Minuto fora de :00/:30. Esses são os minutos mais concorridos da fila
    #    do GitHub; qualquer outro minuto é servido antes.
    # 2. Despertares espalhados pelo dia inteiro, não só na madrugada. Quem
    #    acordar dentro da janela de sono (até 3h30 antes das 05:30 BRT) segura
    #    e publica no horário; quem acordar depois publica na hora (atrasado,
    #    mas publica); quem acordar cedo demais sai limpo em segundos. Todos
    #    são idempotentes, então sobra é barato e falta é que dói.
    - cron: "17 3 * * *"    # 00:17 BRT — bilhete de loteria: só serve se atrasar
    - cron: "17 4 * * *"    # 01:17 BRT — idem
    - cron: "17 5 * * *"    # 02:17 BRT — dorme 3h13 e publica às 05:30 BRT
    - cron: "17 6 * * *"    # 03:17 BRT — dorme 2h13
    - cron: "17 7 * * *"    # 04:17 BRT — dorme 1h13
    - cron: "17 8 * * *"    # 05:17 BRT — dorme 13min
    - cron: "17 9 * * *"    # 06:17 BRT — daqui pra baixo é resgate: publica na hora
    - cron: "17 10 * * *"   # 07:17 BRT
    - cron: "47 11 * * *"   # 08:47 BRT
    - cron: "47 13 * * *"   # 10:47 BRT
    - cron: "47 15 * * *"   # 12:47 BRT
    - cron: "47 17 * * *"   # 14:47 BRT
    - cron: "47 20 * * *"   # 17:47 BRT — última chance do dia
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = só valida a ingestão, não publica"
        required: false
        default: "false"

permissions:
  contents: write

concurrency: publicar-story

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      # ref: main é obrigatório. Sem isso o checkout materializa o SHA do
      # EVENTO, e um despertar disparado antes das 05:30 BRT lê um
      # fila/published.json congelado, cego pro registro que outro run acabou
      # de fazer. Foi assim que o story de 2026-08-07 saiu duas vezes.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publicar story do dia
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WAIT_FOR_TARGET: ${{ github.event_name == 'schedule' }}
        run: python3 publish_story.py

      - name: Registrar publicação
        run: |
          git config user.name "primeiro-deus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 registrar.py
